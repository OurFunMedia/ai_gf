name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          VITE_AGNES_BASE_URL: https://apihub.agnes-ai.com/v1
          VITE_AGNES_CHAT_MODEL: agnes-2.0-flash
          VITE_AGNES_IMAGE_MODEL: agnes-image-2.1-flash
          VITE_NVIDIA_WORKER_URL: https://ai-gf-zen-proxy-production.tobyyip-work.workers.dev

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
